<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBD 지번 일괄 지도표시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a39; --muted:#5f6f80; --line:#d6dde4; --paper:#f7f9fb;
  --jung:#1f5fa8; --jongno:#b0452c; --fail:#8a8f95; --ok:#2f7d4f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"IBM Plex Sans KR",-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper)}
.app{display:grid;grid-template-columns:380px 1fr;height:100%}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff;min-height:0}
.head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
label{font-size:12px;font-weight:500;display:block;margin:8px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font:inherit;font-size:12.5px;color:var(--ink)}
textarea{height:110px;resize:vertical;font-size:12px;line-height:1.45}
.row{display:flex;gap:6px;margin-top:10px}
button{font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:7px 12px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,li:focus-visible{outline:2px solid var(--jung);outline-offset:1px}
.stat{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line)}
.stat b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;padding:8px 18px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 18px;border-bottom:1px solid #eef1f4;cursor:pointer;font-size:12.5px}
li:hover{background:#f2f6fa}
li .n{font-weight:600;font-size:12px;color:#fff;border-radius:3px;text-align:center;height:20px;line-height:20px}
li .a{font-weight:500}
li .m{color:var(--muted);font-size:11.5px;margin-top:2px}
li.fail .a{color:var(--fail)}
#map{width:100%;height:100%}
.pin{font:600 11px "IBM Plex Sans KR",sans-serif;color:#fff;border:2px solid #fff;border-radius:50%;width:24px;height:24px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.tip{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:translateY(-36px);white-space:nowrap}
.empty{padding:40px;color:var(--muted);font-size:13px;line-height:1.6}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:55% 45%}aside{order:2}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="head">
    <h1>CBD 지번 일괄 지도표시</h1>
    <p class="sub">카카오 지오코더로 지번을 좌표로 변환해 표시합니다. 결과는 도로명주소·건물명과 함께 CSV로 내려받을 수 있습니다.</p>
    <label for="key">카카오 JavaScript 키</label>
    <input id="key" placeholder="developers.kakao.com › 내 애플리케이션 › 앱 키">
    <label for="addrs">주소 목록 (한 줄에 하나)</label>
    <textarea id="addrs" placeholder="서울특별시 중구 남대문로5가 541&#10;서울특별시 종로구 서린동 70&#10;…"></textarea>
    <div class="row">
      <button id="run">지도에 표시</button>
      <button id="csv" class="ghost" disabled>CSV 내려받기</button>
    </div>
  </div>
  <div class="stat"><span>입력 <b id="sTotal">0</b></span><span>성공 <b id="sOk">0</b></span><span>실패 <b id="sFail">0</b></span><span>중복 제거 <b id="sDup">0</b></span></div>
  <div class="legend"><span><i class="dot" style="background:var(--jung)"></i>중구</span><span><i class="dot" style="background:var(--jongno)"></i>종로구</span><span><i class="dot" style="background:var(--fail)"></i>변환 실패</span></div>
  <ul id="list"></ul>
</aside>
<div id="map"><div class="empty">카카오 JavaScript 키를 입력하고 <b>지도에 표시</b>를 누르세요.<br>키의 플랫폼(Web)에 이 파일을 여는 도메인(예: https://아이디.github.io)이 등록돼 있어야 합니다.</div></div>
</div>

<script>
const DEFAULT = ``;

const $ = id => document.getElementById(id);
$('addrs').value = DEFAULT;
try { const k = localStorage.getItem('kakaoJsKey'); if (k) $('key').value = k; } catch(e){}

let map, overlays = [], tip, results = [];
const colorOf = r => !r.ok ? 'var(--fail)' : (r.addr.includes('종로구') ? 'var(--jongno)' : 'var(--jung)');

function loadSdk(key){
  return new Promise((res, rej) => {
    if (window.kakao && kakao.maps && kakao.maps.services) return res();
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    s.onload = () => kakao.maps.load(res);
    s.onerror = () => rej(new Error('SDK 로드 실패: 키 또는 등록 도메인을 확인하세요.'));
    document.head.appendChild(s);
  });
}

function geocode(gc, addr){
  return new Promise(res => gc.addressSearch(addr, (r, st) => {
    if (st === kakao.maps.services.Status.OK && r.length){
      const x = r[0];
      res({ok:true, lat:+x.y, lng:+x.x,
           road:(x.road_address && x.road_address.address_name) || '',
           bldg:(x.road_address && x.road_address.building_name) || ''});
    } else res({ok:false});
  }));
}

function render(){
  const ul = $('list'); ul.innerHTML = '';
  results.forEach((r, i) => {
    const li = document.createElement('li');
    li.tabIndex = 0; if (!r.ok) li.className = 'fail';
    li.innerHTML = `<span class="n" style="background:${colorOf(r)}">${i+1}</span>
      <div><div class="a">${r.addr.replace('서울특별시 ','')}</div>
      <div class="m">${r.ok ? (r.bldg ? r.bldg+' / ' : '') + (r.road || '도로명 없음') : '좌표 변환 실패 — 지번 확인 필요'}</div></div>`;
    const go = () => { if (r.ok){ map.setLevel(2); map.panTo(new kakao.maps.LatLng(r.lat, r.lng)); showTip(r, i); } };
    li.onclick = go; li.onkeydown = e => { if (e.key === 'Enter') go(); };
    ul.appendChild(li);
  });
}

function showTip(r, i){
  if (tip) tip.setMap(null);
  tip = new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(r.lat, r.lng), yAnchor:1,
    content:`<div class="tip"><b>${i+1}. ${r.bldg || r.addr.replace('서울특별시 ','')}</b><br>${r.addr.replace('서울특별시 ','')}${r.road ? '<br>'+r.road.replace('서울특별시 ','') : ''}</div>`
  });
  tip.setMap(map);
}

$('run').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { $('key').focus(); return; }
  try { localStorage.setItem('kakaoJsKey', key); } catch(e){}
  const raw = $('addrs').value.split('\n').map(s => s.trim()).filter(Boolean);
  const uniq = [...new Set(raw)];
  $('sTotal').textContent = raw.length; $('sDup').textContent = raw.length - uniq.length;
  $('run').disabled = true; $('run').textContent = '변환 중…';
  try { await loadSdk(key); }
  catch(e){ alert(e.message); $('run').disabled = false; $('run').textContent = '지도에 표시'; return; }

  if (!map){
    $('map').innerHTML = '';
    map = new kakao.maps.Map($('map'), {center:new kakao.maps.LatLng(37.5665, 126.982), level:5});
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  }
  overlays.forEach(o => o.setMap(null)); overlays = []; results = [];
  const gc = new kakao.maps.services.Geocoder();
  for (const addr of uniq){
    const g = await geocode(gc, addr);
    results.push({addr, ...g});
    $('sOk').textContent = results.filter(r => r.ok).length;
    $('sFail').textContent = results.filter(r => !r.ok).length;
  }
  const bounds = new kakao.maps.LatLngBounds();
  results.forEach((r, i) => {
    if (!r.ok) return;
    const pos = new kakao.maps.LatLng(r.lat, r.lng); bounds.extend(pos);
    const el = document.createElement('div');
    el.className = 'pin'; el.style.background = colorOf(r); el.textContent = i+1;
    el.onclick = () => showTip(r, i);
    const o = new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:.5});
    o.setMap(map); overlays.push(o);
  });
  if (!bounds.isEmpty()) map.setBounds(bounds);
  render();
  $('csv').disabled = false;
  $('run').disabled = false; $('run').textContent = '다시 표시';
};

$('csv').onclick = () => {
  const head = 'No,지번주소,도로명주소,건물명,위도,경도,상태\n';
  const body = results.map((r, i) => [i+1, r.addr, r.road||'', r.bldg||'', r.lat||'', r.lng||'', r.ok?'OK':'FAIL']
    .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + head + body], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'cbd_parcels_geocoded.csv'; a.click();
};
</script>
</body>
</html>
